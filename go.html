<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กำลังเปิดแบบประเมิน...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #06c755 0%, #04a647 100%);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .container { padding: 2rem; }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 1.3rem; margin-bottom: 0.5rem; }
    p { font-size: 0.9rem; opacity: 0.85; }
    .fallback {
      display: none;
      margin-top: 2rem;
      padding: 0.8rem 1.5rem;
      background: #fff;
      color: #06c755;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h2>กำลังเปิดแอป LINE...</h2>
    <p>กรุณารอสักครู่</p>
    <a id="fallbackBtn" class="fallback" href="#">หากไม่เปิดอัตโนมัติ กดที่นี่</a>
  </div>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var counter = params.get('counter') || params.get('id') || '';
      var liffId = '2011164567-UjK6uTMI';

      // URL สำหรับกลับมาหน้าประเมินหลังจาก LIFF ทำ auth เสร็จ
      var surveyUrl = 'https://doacoop-it.github.io/officer_survey/?counter=' + encodeURIComponent(counter);

      // LINE native URL scheme — เปิด LINE ตรงไม่ผ่าน browser
      var lineAppUrl = 'line://app/' + liffId + '?returnUrl=' + encodeURIComponent(surveyUrl);

      // LIFF URL สำรอง (เผื่อ line:// ไม่ทำงาน)
      var liffUrl = 'https://liff.line.me/' + liffId + '?returnUrl=' + encodeURIComponent(surveyUrl);

      // ตั้ง fallback button
      document.getElementById('fallbackBtn').href = liffUrl;

      // พยายามเปิด LINE ตรงเลย
      window.location.href = lineAppUrl;

      // ถ้า LINE ไม่เปิดภายใน 2.5 วินาที ให้แสดงปุ่มกดเปิดเอง + ลอง liff URL
      setTimeout(function() {
        document.getElementById('fallbackBtn').style.display = 'inline-block';
        // ลอง liff URL อัตโนมัติ (จะเปิดใน browser แล้ว redirect ไป LINE)
        window.location.href = liffUrl;
      }, 2500);
    })();
  </script>
</body>
</html>
